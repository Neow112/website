<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>SAPFIR — технические работы</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      display:flex;align-items:center;justify-content:center;
      padding:24px;
      background:radial-gradient(circle at 70% 20%,#dfe8ff 0%,#f6f8fd 55%,#ffffff 100%);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:#0f1b3d;text-align:center;
    }
    .box{max-width:520px}
    .logo{font-size:36px;font-weight:500;letter-spacing:-.5px;margin-bottom:36px}
    h1{font-size:clamp(28px,6vw,42px);line-height:1.15;font-weight:600;margin-bottom:16px}
    p{font-size:17px;line-height:1.5;color:#3a4566}
    .contact{margin-top:32px}
    a{color:#1a4fe0;font-weight:600;text-decoration:none}
    a:focus-visible{outline:2px solid #1a4fe0;outline-offset:3px;border-radius:4px}
  </style>
</head>
<body>
  <main class="box">
    <div class="logo">sapfir</div>
    <h1>Ведутся технические работы</h1>
    <p>Приносим извинения за доставленные неудобства.</p>
    <p class="contact">Пригласить ансамбль: <a href="tel:+77000000000">+7 700 000 00 00</a></p>
  </main>
</body>
</html>
