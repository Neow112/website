<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>SAPFIR — технические работы</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      display:flex;align-items:center;justify-content:center;
      padding:24px;
      background:radial-gradient(circle at 70% 20%,#dfe8ff 0%,#f6f8fd 55%,#ffffff 100%);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:#0f1b3d;text-align:center;
    }
    .box{max-width:520px}
    .gears{width:120px;height:auto;margin-bottom:32px}
    .spin{transform-box:fill-box;transform-origin:center}
    .cw{animation:cw 8s linear infinite}
    .ccw{animation:ccw 5.3s linear infinite}
    @keyframes cw{to{transform:rotate(360deg)}}
    @keyframes ccw{to{transform:rotate(-360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}}
    h1{font-size:clamp(28px,6vw,42px);line-height:1.15;font-weight:600;margin-bottom:16px}
    p{font-size:17px;line-height:1.5;color:#3a4566}
    .contact{margin-top:32px}
    a{color:#1a4fe0;font-weight:600;text-decoration:none}
    a:focus-visible{outline:2px solid #1a4fe0;outline-offset:3px;border-radius:4px}
  </style>
</head>
<body>
  <main class="box">
    <svg class="gears" viewBox="0 0 120 104" aria-hidden="true">
      <defs>
        <mask id="hole"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="13" fill="#000"/></mask>
        <g id="gear" mask="url(#hole)">
          <circle cx="50" cy="50" r="32"/>
          <rect x="43" y="6" width="14" height="20" rx="3"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(45 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(90 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(135 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(180 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(225 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(270 50 50)"/>
          <rect x="43" y="6" width="14" height="20" rx="3" transform="rotate(315 50 50)"/>
        </g>
      </defs>
      <g transform="translate(0 20) scale(.84)"><use href="#gear" class="spin cw" fill="#1a4fe0"/></g>
      <g transform="translate(59 6) scale(.56)"><use href="#gear" class="spin ccw" fill="#7a9bf5"/></g>
    </svg>
    <h1>Ведутся технические работы</h1>
    <p>Приносим извинения за доставленные неудобства.</p>
    <p class="contact">Для справок: <a href="mailto:neon@dev.com">neon@dev.com</a></p>
  </main>
</body>
</html>
