<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1A33">
<title>Админ.панель SAPFIR — скачать</title>
<link rel="icon" href="icon.png">
<style>
@font-face{font-family:Manrope;src:url('../assets/fonts/manrope-400.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:Manrope;src:url('../assets/fonts/manrope-500.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:Manrope;src:url('../assets/fonts/manrope-600.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:Manrope;src:url('../assets/fonts/manrope-700.ttf') format('truetype');font-weight:700;font-display:swap}
:root{--ink:#0E1A33;--blue:#3B7BFF;--soft:#9CC3FF;--ease:cubic-bezier(.1,.9,.2,1);color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Manrope,Arial,sans-serif;background:var(--ink);color:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--soft);outline-offset:4px;border-radius:12px}

/* фон: медленно плывущий свет */
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.g1{width:720px;height:720px;right:-220px;top:-260px;background:#2C5BD8;filter:blur(130px);opacity:.55;animation:drift 16s ease-in-out infinite}
.g2{width:640px;height:640px;left:-240px;bottom:-300px;background:#6A4FD6;filter:blur(140px);opacity:.28;animation:drift 20s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,40px)}}

.wrap{position:relative;z-index:1;width:min(1080px,calc(100% - 40px));margin:0 auto;padding:72px 0 48px}
.hero{display:flex;gap:48px;align-items:flex-start}
.main{flex:1 1 auto;min-width:0}

.word{position:relative;display:inline-block;font-size:clamp(64px,11vw,108px);font-weight:500;letter-spacing:-.069em;line-height:1}
.word span{display:block;animation:up .9s var(--ease) both}
.dot{position:absolute;right:-.2em;top:.08em;width:.17em;height:.17em;border-radius:50%;background:var(--blue);animation:pop .6s cubic-bezier(.3,1.6,.5,1) .55s both}
.by{margin-top:14px;font-size:16px;color:rgba(255,255,255,.55);animation:fade 1s ease .8s both}
.by b{color:#fff;font-weight:600}
h1{margin:28px 0 0;font-size:clamp(22px,3.2vw,28px);font-weight:600;letter-spacing:-.01em;animation:up .9s var(--ease) .3s both}
.lead{margin:8px 0 0;color:rgba(255,255,255,.62);font-size:15px;line-height:1.6;animation:up .9s var(--ease) .38s both}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;animation:up .9s var(--ease) .48s both}
.pri{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:58px;padding:0 30px;border-radius:29px;background:#fff;color:#14233F;font-size:16px;font-weight:600;box-shadow:0 10px 40px rgba(59,123,255,.35);transition:transform .35s var(--ease),box-shadow .35s}
.pri:hover{transform:translateY(-2px);box-shadow:0 16px 52px rgba(59,123,255,.5)}
.pri:active{transform:scale(.97)}
.sec{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 24px;border-radius:29px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:15px;font-weight:600;transition:background .25s,transform .35s var(--ease)}
.sec:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.ic{width:20px;height:20px;flex:0 0 auto}
.meta{margin-top:12px;font-size:13px;color:rgba(255,255,255,.5);min-height:18px;animation:fade 1s ease .7s both}
.note{margin-top:16px;max-width:520px;font-size:14px;line-height:1.55;color:#FFD7A8;background:rgba(255,170,60,.12);border:1px solid rgba(255,170,60,.25);border-radius:14px;padding:12px 14px}

.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.qr{width:236px;flex:0 0 236px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-top:12px;animation:up .9s var(--ease) .6s both}
.qr-box{width:176px;height:176px;padding:10px;background:#fff;border-radius:16px;animation:ring 1.6s ease-out 1.3s 2}
.qr-box svg,.qr-box img{width:100%;height:100%;display:block}
.qr p{margin:0;font-size:13px;line-height:1.45;color:rgba(255,255,255,.75)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(59,123,255,.6)}100%{box-shadow:0 0 0 20px rgba(59,123,255,0)}}

.how{margin-top:44px;padding:22px;animation:up .9s var(--ease) .75s both}
.how-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.how-top h2{margin:0 auto 0 0;font-size:18px;font-weight:700}
.tab{height:38px;padding:0 16px;border-radius:19px;font-size:13px;font-weight:600;background:rgba(255,255,255,.08);transition:background .25s,color .25s}
.tab[aria-selected=true]{background:#fff;color:#14233F}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.step{background:rgba(255,255,255,.05);border-radius:18px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;animation:up .55s var(--ease) both}
.step:nth-child(2){animation-delay:.08s}.step:nth-child(3){animation-delay:.16s}
.ill{height:150px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ill img{width:56px;height:56px;border-radius:15px}
.step h3{margin:8px 0 0;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center}
.step h3 i{font-style:normal;flex:0 0 26px;height:26px;border-radius:13px;background:rgba(59,123,255,.25);color:var(--soft);font-size:12px;display:flex;align-items:center;justify-content:center}
.step p{margin:0 0 0 36px;font-size:13px;line-height:1.55;color:rgba(255,255,255,.62)}
/* мини-сцены */
.file{width:min(250px,86%);background:#fff;border-radius:12px;padding:11px 12px;color:#14233F;display:flex;gap:10px;align-items:center;animation:hl 5s infinite,clk 5s infinite}
.file .ext{width:32px;height:32px;flex:0 0 32px;border-radius:8px;background:#14233F;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center}
.file b{display:block;font-size:11px}
.file em{display:block;font-style:normal;font-size:10px;font-weight:700;color:#1058F5;margin-top:4px;animation:dlText 5s infinite}
.track{height:4px;border-radius:2px;background:#E3EAF6;overflow:hidden;margin-top:5px}
.track i{display:block;height:4px;width:0;background:#1058F5;animation:dl 5s infinite}
.cur{position:absolute;width:18px;height:18px;right:28%;bottom:22%;animation:cur 5s infinite}
.smart{position:absolute;inset:0;border-radius:14px;background:#0F5BBF;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700;text-align:left}
.smart u{font-size:12px;font-weight:500}
.smart span{position:absolute;right:14px;bottom:14px;font-size:12px;background:#fff;color:#0F5BBF;padding:7px 12px;border-radius:4px;animation:tap 2.4s ease-in-out infinite}
.inst{width:min(260px,88%);background:#fff;border-radius:8px;overflow:hidden;color:#1B1B1F;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:11px;text-align:left}
.inst .t{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:10px;border-bottom:1px solid #EEF1F6}
.inst .t img{width:12px;height:12px;border-radius:3px}
.inst .b{padding:12px;display:flex;flex-direction:column;gap:9px}
.inst .bar{height:6px;border-radius:3px;background:#E3EAF6;overflow:hidden}
.inst .bar i{display:block;height:6px;width:0;background:#1058F5;animation:bar 5s infinite}
.inst .ck{display:flex;align-items:center;gap:6px}
.inst .ck i{width:14px;height:14px;border-radius:3px;background:#1058F5;display:flex;align-items:center;justify-content:center;animation:chk 5s infinite}
.inst .f{display:flex;justify-content:flex-end;padding:0 12px 10px}
.inst .f span{font-size:10px;padding:4px 14px;border:1px solid #1058F5;border-radius:3px;animation:done 5s infinite}
.perm{width:min(260px,88%);background:#1F2A3D;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;font-size:12px;line-height:1.4;text-align:left}
.sw{flex:0 0 40px;height:22px;border-radius:11px;padding:2px;animation:sw 5s infinite}
.sw i{display:block;width:18px;height:18px;border-radius:9px;background:#fff;animation:knob 5s infinite}
.dlg{position:relative;width:min(240px,86%);height:120px;background:#fff;border-radius:18px;color:#14233F;padding:14px;text-align:left}
.dlg .who{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700}
.dlg .who img{width:30px;height:30px;border-radius:15px}
.dlg small{display:block;font-size:11px;color:#5F6470;margin-top:8px}
.dlg .row{position:absolute;left:14px;right:14px;bottom:14px;height:28px}
.dlg .row b{position:absolute;right:0;bottom:0;font-size:12px;color:#1058F5;animation:inst 5s infinite}
.dlg .row i{position:absolute;left:0;bottom:10px;height:4px;border-radius:2px;background:#1058F5;animation:prog 5s infinite}
.dlg .row span{position:absolute;right:0;bottom:0;font-size:12px;font-weight:700;color:#fff;background:#1058F5;padding:6px 14px;border-radius:14px;animation:open 5s infinite}
@keyframes dl{0%,8%{width:0}45%,100%{width:100%}}
@keyframes dlText{0%,44%{opacity:0}50%,100%{opacity:1}}
@keyframes cur{0%,50%{transform:translate(60px,50px);opacity:0}60%{opacity:1}72%,100%{transform:none;opacity:1}}
@keyframes clk{0%,74%{transform:scale(1)}78%{transform:scale(.92)}84%,100%{transform:scale(1)}}
@keyframes hl{0%,74%{background:#fff}78%,100%{background:#E3EAF6}}
@keyframes bar{0%,10%{width:0}60%,100%{width:100%}}
@keyframes chk{0%,62%{opacity:0;transform:scale(.4)}70%,100%{opacity:1;transform:none}}
@keyframes done{0%,72%{box-shadow:0 0 0 0 rgba(16,88,245,0)}80%{box-shadow:0 0 0 6px rgba(16,88,245,.35)}90%,100%{box-shadow:0 0 0 0 rgba(16,88,245,0)}}
@keyframes sw{0%,40%{background:#5A6476}55%,100%{background:#3B7BFF}}
@keyframes knob{0%,40%{transform:none}55%,100%{transform:translateX(18px)}}
@keyframes inst{0%,30%{opacity:1}36%,100%{opacity:0}}
@keyframes prog{0%,34%{opacity:0;width:0}38%{opacity:1;width:0}70%{width:100%;opacity:1}74%,100%{opacity:0;width:100%}}
@keyframes open{0%,72%{opacity:0;transform:scale(.9)}80%,100%{opacity:1;transform:none}}
@keyframes tap{0%,60%,100%{transform:scale(1)}70%{transform:scale(.88)}}

.news{margin-top:16px;padding:18px 22px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.75);animation:up .9s var(--ease) .85s both}
.news h2{margin:0 0 6px;font-size:15px;color:#fff}
.news ul{margin:0;padding-left:18px}
footer{margin-top:36px;text-align:center;font-size:12px;color:rgba(255,255,255,.35)}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}

@media (max-width:820px){
  .wrap{padding-top:56px}
  .hero{flex-direction:column;align-items:center;text-align:center}
  .actions{justify-content:center;flex-direction:column;align-items:stretch}
  .qr{display:none}
  .steps{grid-template-columns:1fr}
  .ill{height:150px}
  .sec{height:50px;background:none;border-color:transparent;color:var(--soft)}
  .note{margin-inline:auto;text-align:left}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<main class="wrap">
  <section class="hero">
    <div class="main">
      <div class="word"><span>sapfir</span><i class="dot"></i></div>
      <div class="by">by <b>Neon</b></div>
      <h1>Админ.панель сайта sapfirshow.kz</h1>

      <div class="actions">
        <a class="pri" id="primary" href="#">
          <svg class="ic" id="pIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
          <span id="pText">Скачать</span>
        </a>
        <a class="sec" id="secondary" href="#"><span id="sText">Android</span></a>
      </div>
      <div class="meta" id="meta"></div>
      <div class="note" id="note" hidden></div>
    </div>

    <aside class="qr glass" id="qr">
      <div class="qr-box" id="qrBox" aria-label="QR-код для скачивания на телефон"></div>
      <p>Наведите камеру телефона и нажмите «Скачать для Android»</p>
    </aside>
  </section>

  <section class="how glass">
    <div class="how-top">
      <h2>Как установить</h2>
      <button class="tab" id="tWin" role="tab" aria-selected="true">Windows</button>
      <button class="tab" id="tAnd" role="tab" aria-selected="false">Android</button>
    </div>
    <div class="steps" id="steps"></div>
  </section>

  <section class="news glass" id="news" hidden>
    <h2 id="newsTitle">Что нового</h2>
    <div id="newsBody"></div>
  </section>

  <footer>Для входа нужен пароль администратора</footer>
</main>

<template id="stepsWin">
  <div class="step"><div class="ill"><div class="file"><span class="ext">exe</span><div style="flex:1"><b>SAPFIR-Windows.exe</b><div class="track"><i></i></div><em>Открыть файл</em></div></div><svg class="cur" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 2-3 6z" fill="#fff" stroke="#14233F" stroke-width="1.5" stroke-linejoin="round"/></svg></div><h3><i>1</i>Откройте файл</h3><p>Он внизу браузера — нажмите на него</p></div>
  <div class="step"><div class="ill"><div class="smart">Система Windows защитила ваш компьютер<u>Подробнее</u><span>Выполнить в любом случае</span></div></div><h3><i>2</i>Синее окно? Не страшно</h3><p>«Подробнее» → «Выполнить в любом случае»</p></div>
  <div class="step"><div class="ill"><div class="inst"><div class="t"><img src="icon.png" alt="">Установка SAPFIR</div><div class="b"><div class="bar"><i></i></div><div class="ck"><i><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></i>Запустить SAPFIR</div></div><div class="f"><span>Готово</span></div></div></div><h3><i>3</i>Пара кликов — и готово</h3><p>SAPFIR откроется сам</p></div>
</template>
<template id="stepsAnd">
  <div class="step"><div class="ill"><div class="file" style="border-radius:16px"><span class="ext">apk</span><div style="flex:1"><b>SAPFIR-Android.apk</b><div class="track"><i></i></div><em>Нажмите, чтобы открыть</em></div></div></div><h3><i>1</i>Откройте файл</h3><p>Нажмите на уведомление о загрузке</p></div>
  <div class="step"><div class="ill"><div class="perm"><span style="flex:1">Разрешить установку из этого источника</span><span class="sw"><i></i></span></div></div><h3><i>2</i>Разрешите установку</h3><p>Включите переключатель и вернитесь</p></div>
  <div class="step"><div class="ill"><div class="dlg"><div class="who"><img src="icon.png" alt="">SAPFIR</div><small>Установить это приложение?</small><div class="row"><b>Установить</b><i></i><span>Открыть</span></div></div></div><h3><i>3</i>Установите</h3><p>«Установить», затем «Открыть»</p></div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  // Файлы лежат в GitHub Releases репозитория сайта — имена файлов не меняются от версии к версии.
  var REPO = 'Neow112/website';
  var WIN = 'SAPFIR-Windows.exe', APK = 'SAPFIR-Android.apk';
  var base = 'https://github.com/' + REPO + '/releases/latest/download/';
  var winUrl = base + WIN, apkUrl = base + APK;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isMac = !isIOS && /Mac OS X|Macintosh/i.test(ua);

  var WIN_ICON = '<path fill="#1058F5" d="M3 5.5 10 4.5v7H3zM11 4.3 21 3v8.5H11zM3 12.5h7v7l-7-1zM11 12.5h10V21l-10-1.4z"/>';
  var AND_ICON = '<path fill="#3DDC84" d="M6 10h12v7a1 1 0 0 1-1 1h-1v3h-2v-3h-4v3H8v-3H7a1 1 0 0 1-1-1zM6.5 9a5.5 5.5 0 0 1 11 0z"/>';

  var $ = function (id) { return document.getElementById(id); };
  var primaryAndroid = isAndroid;
  $('primary').href = primaryAndroid ? apkUrl : winUrl;
  $('pIcon').innerHTML = primaryAndroid ? AND_ICON : WIN_ICON;
  $('pText').textContent = primaryAndroid ? 'Скачать для Android' : 'Скачать для Windows';
  $('secondary').href = primaryAndroid ? winUrl : apkUrl;
  $('sText').textContent = primaryAndroid ? 'Версия для Windows' : 'Android';

  var note = $('note');
  if (isIOS) { note.hidden = false; note.textContent = 'Для iPhone и iPad приложения нет. Откройте эту страницу на компьютере с Windows или на телефоне Android.'; }
  else if (isMac) { note.hidden = false; note.textContent = 'Приложение работает на Windows. На Mac его не установить — откройте страницу на компьютере с Windows или на телефоне Android.'; }

  // шаги установки
  function show(which) {
    var win = which === 'win';
    $('tWin').setAttribute('aria-selected', win); $('tAnd').setAttribute('aria-selected', !win);
    var steps = $('steps'); steps.innerHTML = '';
    steps.appendChild($(win ? 'stepsWin' : 'stepsAnd').content.cloneNode(true));
  }
  $('tWin').onclick = function () { show('win'); };
  $('tAnd').onclick = function () { show('and'); };
  show(isAndroid ? 'and' : 'win');

  // QR-код ведёт на эту же страницу: через камеру файл качается медленно,
  // а в обычном браузере телефона — по кнопке за секунды
  try {
    var qr = qrcode(0, 'M'); qr.addData('https://sapfirshow.kz/app/'); qr.make();
    $('qrBox').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch (e) { $('qr').hidden = true; }

  // версия, размер и «что нового» — из последнего выпуска на GitHub
  function mb(b) { return Math.round(b / 1048576) + ' МБ'; }
  function date(s) {
    var m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    var d = new Date(s); return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
  }
  fetch('https://api.github.com/repos/' + REPO + '/releases/latest').then(function (r) { return r.ok ? r.json() : null; }).then(function (rel) {
    if (!rel) return;
    var sizes = {};
    (rel.assets || []).forEach(function (a) { sizes[a.name] = a.size; });
    var name = primaryAndroid ? APK : WIN;
    var parts = [rel.name || rel.tag_name];
    if (sizes[name]) parts.push(mb(sizes[name]));
    parts.push(primaryAndroid ? 'Android 8 и новее' : 'Windows 10 и 11');
    if (rel.published_at) parts.push(date(rel.published_at));
    $('meta').textContent = parts.join(' · ');
    if (rel.body && rel.body.trim()) {
      var lines = rel.body.trim().split(/\r?\n/).map(function (l) { return l.replace(/^[-*•]\s*/, '').trim(); }).filter(Boolean);
      var ul = document.createElement('ul');
      lines.forEach(function (l) { var li = document.createElement('li'); li.textContent = l; ul.appendChild(li); });
      $('newsBody').appendChild(ul); $('news').hidden = false;
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
